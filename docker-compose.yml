services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    networks:
      - internal
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@database:5432/${POSTGRES_DB:?}
    depends_on:
      database:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3001}:3001'
    networks:
      - internal
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  migration:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migration
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@database:5432/${POSTGRES_DB:?}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal
    restart: 'no'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runtime
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:3001}
    environment:
      NODE_ENV: production
      BACKEND_URL: ${BACKEND_URL:-http://backend:3001}
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'
    networks:
      - internal
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.30
    ports:
      - '${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
